name: Quality

on:
  push:
    branches: [main, feat/core-memory-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -ra --tb=short --import-mode=importlib

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check lint rules
        run: python -m ruff check .

      - name: Check type annotations
        run: python -m mypy remem experiments

      - name: Check runtime dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q remem experiments

      - name: Build distribution artifacts
        run: python -m build
