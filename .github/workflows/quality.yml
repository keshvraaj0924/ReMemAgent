name: Quality

on:
  push:
    branches: [main, feat/core-memory-engine]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Repair feature-branch formatting
        if: github.ref == 'refs/heads/feat/core-memory-engine'
        run: |
          python -m ruff format .
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply ruff formatting"
          git push origin HEAD:feat/core-memory-engine

      - name: Verify installed package imports
        run: python -c "import remem, experiments; print(remem.__name__, experiments.__name__)"

      - name: Run tests
        run: |
          mkdir -p test-results
          python -m pytest -ra --strict-config --strict-markers --tb=short --import-mode=importlib --junitxml=test-results/pytest-${{ matrix.python-version }}.xml

      - name: Upload pytest report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: test-results/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Check lint rules
        run: python -m ruff check .

      - name: Check type annotations
        run: python -m mypy remem experiments

      - name: Check runtime dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q remem experiments

      - name: Build distribution artifacts
        run: python -m build

      - name: Smoke test built wheel and source distribution
        shell: bash
        run: |
          set -euo pipefail
          smoke_env="${RUNNER_TEMP}/rememagent-distribution-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --upgrade pip
          "$smoke_env/bin/python" -m pip install --no-deps dist/*.whl
          "$smoke_env/bin/python" -c "import remem, experiments; print(remem.__name__, experiments.__name__)"
          "$smoke_env/bin/remem-ablation" --help >/dev/null
          "$smoke_env/bin/remem-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-paired-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-verify-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-check-environments" --help >/dev/null
          "$smoke_env/bin/python" -m pip uninstall -y rememagent >/dev/null
          "$smoke_env/bin/python" -m pip install --no-deps dist/*.tar.gz
          "$smoke_env/bin/python" -c "import remem, experiments; print(remem.__name__, experiments.__name__)"
          "$smoke_env/bin/remem-ablation" --help >/dev/null
          "$smoke_env/bin/remem-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-paired-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-verify-benchmark" --help >/dev/null
          "$smoke_env/bin/remem-check-environments" --help >/dev/null

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
