name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Verify installed package imports
        run: python -c "import remem, experiments; print(remem.__name__, experiments.__name__)"

      - name: Run tests with branch coverage
        run: |
          mkdir -p test-results coverage-results
          python -m pytest -ra --strict-config --strict-markers --tb=short --import-mode=importlib \
            --cov=remem --cov=experiments --cov-branch \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage-results/coverage-${{ matrix.python-version }}.xml \
            --junitxml=test-results/pytest-${{ matrix.python-version }}.xml

      - name: Upload pytest report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python-version }}
          path: test-results/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage-results/coverage-${{ matrix.python-version }}.xml
          if-no-files-found: error

      - name: Check formatting
        run: |
          mkdir -p format-results
          python -m ruff format --check --diff . > format-results/ruff-${{ matrix.python-version }}.diff 2>&1

      - name: Upload formatting diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruff-format-${{ matrix.python-version }}
          path: format-results/ruff-${{ matrix.python-version }}.diff
          if-no-files-found: error

      - name: Check lint rules
        run: |
          mkdir -p lint-results
          python -m ruff check . 2>&1 | tee lint-results/ruff-${{ matrix.python-version }}.txt

      - name: Upload lint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ruff-lint-${{ matrix.python-version }}
          path: lint-results/ruff-${{ matrix.python-version }}.txt
          if-no-files-found: error

      - name: Check type annotations
        run: python -m mypy remem experiments

      - name: Check runtime dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q remem experiments

      - name: Build distribution artifacts
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error
