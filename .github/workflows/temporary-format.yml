name: Temporary format repair

on:
  push:
    branches: [feat/core-memory-engine]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: feat/core-memory-engine
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff>=0.16,<0.17"

      - name: Apply repository formatting
        run: python -m ruff format .

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply ruff formatting"
          git push origin HEAD:feat/core-memory-engine
