name: Temporary Ruff Diagnostic

on:
  push:
    branches: [feat/core-memory-engine]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install "ruff>=0.6"
      - run: python -m ruff check . --output-format=json > ruff.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostic
          path: ruff.json
