[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rememagent"
version = "0.1.0"
description = "Adaptive reconstructive memory and counterfactual routing for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Keshvraaj B B"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
remem-ablation = "experiments.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["remem", "experiments"]
