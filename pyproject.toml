[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rememagent"
version = "0.1.0"
description = "Adaptive reconstructive memory and counterfactual routing for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Keshvraaj B B"}]
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["remem", "experiments"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Quality #1654 measured 93.54% line coverage with branch coverage enabled.
# Keep the gate below the observed baseline so small reporting differences do not
# create noise while still preventing meaningful coverage regressions.
fail_under = 93

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["remem"]
